services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8002}
        NEXT_PUBLIC_ASSETS_DIR: ${NEXT_PUBLIC_ASSETS_DIR:-}
        NEXT_PUBLIC_SHOW_COMPONENTS: ${NEXT_PUBLIC_SHOW_COMPONENTS:-}
    image: sakuflow-ai
    container_name: sakuflow-ai
    ports:
      - '80:80'
    # Server-only runtime values are optional and never copied into build stages.
    environment:
      API_URL: ${API_URL:-}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-default}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
